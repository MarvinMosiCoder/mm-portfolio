<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0D10" />
    <meta
      name="description"
      content="Marvin Mosico — Full-Stack Web Developer"
    />

    <title>Marvin Mosico</title>

    <!-- Runs before first paint so the page never flashes the light theme on
         its way to a dark one. React sets the same class from the same stored
         value once it mounts; this only removes the gap in between. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* storage blocked - fall back to the stylesheet default */
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

  </body>
</html>
